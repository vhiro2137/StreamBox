303b;border:1px solid #3a414e;color:var(--fg);font-size:13px;opacity:0;pointer-events:none;transition:opacity 160ms,transform 160ms}.toast.show{opacity:1;transform:translate(-50%,0)}.fullscreen .toolbar,.fullscreen .playlist{display:none}.fullscreen .app{grid-template-rows:1fr 112px;background:#000}.fullscreen .workspace{grid-template-columns:1fr}.fullscreen .controls{position:fixed;left:0;right:0;bottom:0;height:112px;background:linear-gradient(transparent,rgba(0,0,0,.92));border:0;grid-template-rows:40px 72px 0}.fullscreen .status-row,.fullscreen .now-playing,.fullscreen #stopBtn,.fullscreen #modeBtn{display:none}.fullscreen .main-row{grid-template-columns:1fr auto 1fr}.fullscreen .tools{grid-column:3}.fullscreen .canvas{position:fixed;inset:0}.fullscreen .controls{z-index:10}.fullscreen .video-poster{inset:0}@keyframes spin{to{transform:rotate(360deg)}}

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></symbol><symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 6v12M16 6v12"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3zM3 7V5h7l2 2"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="m9 15 6-6M7.5 17.5l-1 1a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0M16.5 6.5l1-1a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol><symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></symbol><symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></symbol><symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1" fill="currentColor" stroke="none"/></symbol><symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"/></symbol><symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol><symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></symbol><symbol id="i-media" viewBox="0 0 64 64"><rect x="9" y="12" width="46" height="40" rx="7"/><path d="m27 24 15 8-15 8zM17 18h30"/></symbol><symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19zM12 9v5M12 17h.01"/></symbol><symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-3-3h3M19 16a3 3 0 1 1-3-3h3"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</defs></svg>
<main class="app" data-od-id="streambox-desktop-app">
<header class="toolbar" data-od-id="top-toolbar"><div class="brand" data-od-id="brand"><div class="logo"><svg class="icon"><use href="#i-play"/></svg></div><span>StreamBox</span></div><button class="btn secondary" id="fileBtn" data-od-id="open-file-cta" title="打开文件（Ctrl+O）"><svg class="icon"><use href="#i-folder"/></svg>打开文件</button><button class="btn secondary" id="urlBtn" data-od-id="open-url-cta" title="打开 URL（Ctrl+U）"><svg class="icon"><use href="#i-link"/></svg>打开 URL</button><div class="spacer"></div><button class="icon-btn" id="listBtn" data-od-id="playlist-toggle" aria-label="收起播放列表" title="收起播放列表"><svg class="icon"><use href="#i-list"/></svg></button><button class="icon-btn" data-od-id="more-menu" aria-label="更多设置" title="更多设置"><svg class="icon"><use href="#i-more"/></svg></button></header>
<section class="workspace" id="workspace" data-od-id="player-workspace"><section class="canvas" id="canvas" data-state="playing" data-od-id="video-canvas" tabindex="0" aria-label="视频播放区域，双击进入全屏"><div class="video-poster"></div><div class="canvas-message"><svg class="icon media-glyph"><use href="#i-media"/></svg><h1 data-od-id="empty-heading">打开媒体开始播放</h1><p>选择本地音视频文件，或粘贴 HTTP/HTTPS 媒体地址</p><div class="canvas-actions"><button class="btn primary" onclick="simulateOpen()">打开文件</button><button class="btn secondary" onclick="openUrlDialog()">打开 URL</button></div><p style="margin-top:12px;font-size:12px;color:var(--tertiary)">也可以将文件拖放到此处</p></div><div class="state-panel buffering"><div class="spinner"></div><h2>正在缓冲 42%</h2><p>网络连接较慢，播放将在缓冲完成后继续</p><button class="btn secondary" onclick="setState('playing')">取消</button></div><div class="state-panel error"><svg class="icon error-mark"><use href="#i-warning"/></svg><h2>无法播放此媒体</h2><p>无法连接到服务器，请检查网络或地址。</p><div class="canvas-actions"><button class="btn primary" onclick="setState('buffering')">重试</button><button class="btn secondary" onclick="openUrlDialog()">打开其他媒体</button></div></div><div class="state-panel audio"><div class="audio-cover"><svg class="icon"><use href="#i-music"/></svg></div><div class="audio-meta"><h2>城市雨夜电台</h2><small>音频 · FLAC</small></div></div><div class="pause-flash"><svg class="icon"><use href="#i-pause"/></svg></div></section>
<aside class="playlist" data-od-id="playlist-panel"><div class="playlist-head"><h2 data-od-id="playlist-heading">播放列表</h2><span class="count">8</span><div class="spacer"></div><button class="btn add-btn" onclick="simulateOpen()">添加</button><button class="icon-btn" aria-label="播放列表更多操作" title="播放列表更多操作"><svg class="icon"><use href="#i-more"/></svg></button></div><div class="playlist-list" id="playlistList"></div></aside></section>
<footer class="controls" data-od-id="playback-controls"><div class="progress-row"><span class="current" id="currentTime">18:42</span><input class="range" id="progress" data-od-id="progress-slider" type="range" min="0" max="100" value="32" aria-label="播放进度"><span id="totalTime">58:20</span></div><div class="main-row"><div class="now-playing"><div class="mini-thumb"></div><div class="now-copy"><div class="now-title" id="nowTitle">在雾海边缘</div><div class="now-sub">本地视频 · MKV</div></div></div><div class="transport"><button class="icon-btn" id="prevBtn" aria-label="上一首" title="上一首（P）"><svg class="icon"><use href="#i-prev"/></svg></button><button class="icon-btn play-main" id="playBtn" data-od-id="play-pause-button" aria-label="暂停" title="暂停（Space）"><svg class="icon"><use id="playIcon" href="#i-pause"/></svg></button><button class="icon-btn" id="nextBtn" aria-label="下一首" title="下一首（N）"><svg class="icon"><use href="#i-next"/></svg></button><button class="icon-btn" id="stopBtn" aria-label="停止" title="停止"><svg class="icon"><use href="#i-stop"/></svg></button></div><div class="tools"><button class="btn speed" id="speedBtn" data-od-id="speed-button">1.0×</button><button class="icon-btn" id="modeBtn" data-od-id="play-mode-button" aria-label="列表循环" title="列表循环"><svg class="icon"><use href="#i-repeat"/></svg></button><button class="icon-btn" id="muteBtn" aria-label="静音" title="静音（M）"><svg class="icon"><use href="#i-volume"/></svg></button><input class="range volume" id="volume" type="range" min="0" max="100" value="70" aria-label="音量"><button class="icon-btn" id="fullBtn" data-od-id="fullscreen-button" aria-label="进入全屏" title="进入全屏（F）"><svg class="icon"><use href="#i-full"/></svg></button></div></div><div class="status-row"><div class="status-left"><span class="status-dot"></span><span id="statusText">正在播放</span></div><span id="mediaInfo">1080p · H.264 · AAC</span></div></footer>
</main>
<div class="dialog-layer" id="urlLayer" data-od-id="open-url-dialog"><form class="dialog" id="urlForm"><h2>打开网络媒体</h2><p>输入可直接访问的 HTTP/HTTPS 音视频地址。</p><div class="url-wrap"><input class="url-input" id="urlInput" placeholder="https://example.com/media.mp4" autocomplete="off"><button type="button" class="icon-btn clear-input" id="clearUrl" aria-label="清空地址"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="validation" id="validation"></div><div class="dialog-actions"><button type="button" class="btn secondary" onclick="closeUrlDialog()">取消</button><button type="submit" class="btn primary" id="submitUrl" disabled>打开</button></div></form></div>
<div class="menu speed-menu" id="speedMenu" data-od-id="speed-menu"></div><div class="menu mode-menu" id="modeMenu" data-od-id="play-mode-menu"></div><div class="toast" id="toast" role="status"></div>
<script>
const items=[['在雾海边缘','58:20','scene'],['城市雨夜电台','42:16','audio'],['工业设计方法论 03','01:22:04','scene'],['北岸慢行纪录','24:39','scene'],['产品访谈：从洞察到决策','53:08','scene'],['Jazz Live Session','36:45','audio'],['城市建筑观察','18:22','scene'],['远程协作工作坊','01:05:40','scene']];let current=0,state='playing',playing=true,toastTimer;
const $=s=>document.querySelector(s),icon=n=>`<svg class="icon"><use href="#i-${n}"/></svg>`;
function renderList(){playlistList.innerHTML=items.map((x,i)=>`<div class="playlist-item ${i===current?'playing':''}" data-od-id="playlist-item-${i+1}" data-index="${i}" tabindex="0"><div class="thumb ${x[2]}">${icon(x[2]==='audio'?'music':'play')}</div><div class="item-copy"><div class="item-title">${x[0]}</div><div class="item-sub">${x[2]==='audio'?'FLAC · 本地音频':'MKV · 本地视频'}</div></div><span class="duration">${i===current?'● '+x[1]:x[1]}</span></div>`).join('');document.querySelectorAll('.playlist-item').forEach(el=>el.ondblclick=()=>selectItem(+el.dataset.index))}
function selectItem(i){current=i;nowTitle.textContent=items[i][0];state=items[i][2]==='audio'?'audio':'playing';playing=true;setState(state);renderList()}
function setState(s){state=s;canvas.dataset.state=s;const map={playing:'正在播放',paused:'已暂停',buffering:'正在缓冲 42%',error:'播放失败',audio:'正在播放',empty:'尚未播放'};statusText.textContent=map[s];$('.status-dot').style.background=s==='error'?'var(--error)':s==='buffering'?'var(--warning)':'var(--success)';playing=s==='playing'||s==='audio';playIcon.setAttribute('href',playing?'#i-pause':'#i-play');playBtn.setAttribute('aria-label',playing?'暂停':'播放');fullBtn.disabled=s==='audio';mediaInfo.style.display=s==='empty'?'none':'block'}
function togglePlay(){if(state==='error'||state==='buffering'||state==='empty')return;setState(playing?'paused':(items[current][2]==='audio'?'audio':'playing'))}
function simulateOpen(){showToast('已添加 3 个媒体');setState('buffering');setTimeout(()=>setState('playing'),1200)}
function openUrlDialog(){urlLayer.classList.add('open');setTimeout(()=>urlInput.focus(),30)}function closeUrlDialog(){urlLayer.classList.remove('open');validation.textContent='';urlInput.classList.remove('invalid')}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
fileBtn.onclick=simulateOpen;urlBtn.onclick=openUrlDialog;listBtn.onclick=()=>{workspace.classList.toggle('list-collapsed');listBtn.setAttribute('aria-label',workspace.classList.contains('list-collapsed')?'展开播放列表':'收起播放列表')};playBtn.onclick=togglePlay;stopBtn.onclick=()=>{progress.value=0;currentTime.textContent='00:00';setState('paused');statusText.textContent='已停止'};prevBtn.onclick=()=>selectItem((current-1+items.length)%items.length);nextBtn.onclick=()=>selectItem((current+1)%items.length);
progress.oninput=()=>{const secs=Math.round(3500*progress.value/100),m=Math.floor(secs/60),s=String(secs%60).padStart(2,'0');currentTime.textContent=`${String(m).padStart(2,'0')}:${s}`};muteBtn.onclick=()=>{volume.value=volume.value==='0'?70:0;showToast(volume.value==='0'?'已静音':'已恢复音量')};
const speeds=['2.0×','1.75×','1.5×','1.25×','1.0×','0.75×','0.5×'];function renderSpeeds(){speedMenu.innerHTML=speeds.map(x=>`<button class="${x===speedBtn.textContent?'selected':''}">${x}</button>`).join('');speedMenu.querySelectorAll('button').forEach(b=>b.onclick=()=>{speedBtn.textContent=b.textContent;speedMenu.classList.remove('open');renderSpeeds();showToast(`播放速度已调整为 ${b.textContent}`)})}speedBtn.onclick=e=>{speedMenu.style.left=`${e.currentTarget.getBoundingClientRect().left}px`;speedMenu.classList.toggle('open');modeMenu.classList.remove('open')};renderSpeeds();
const modes=['顺序播放','列表循环','单曲循环'];let mode='列表循环';function renderModes(){modeMenu.innerHTML=modes.map(x=>`<button class="${x===mode?'selected':''}">${x}</button>`).join('');modeMenu.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.textContent;modeBtn.title=mode;modeBtn.setAttribute('aria-label',mode);modeMenu.classList.remove('open');renderModes();showToast(`已切换为${mode}`)})}modeBtn.onclick=e=>{modeMenu.style.left=`${Math.max(8,e.currentTarget.getBoundingClientRect().left-72)}px`;modeMenu.classList.toggle('open');speedMenu.classList.remove('open')};renderModes();
urlInput.oninput=()=>{submitUrl.disabled=!urlInput.value.trim();validation.textContent='';urlInput.classList.remove('invalid');clearUrl.style.display=urlInput.value?'inline-flex':'none'};clearUrl.onclick=()=>{urlInput.value='';urlInput.dispatchEvent(new Event('input'));urlInput.focus()};urlForm.onsubmit=e=>{e.preventDefault();if(!/^https?:\/\//i.test(urlInput.value.trim())){urlInput.classList.add('invalid');validation.textContent='请输入有效的 HTTP 或 HTTPS 地址';return}submitUrl.disabled=true;submitUrl.textContent='正在打开';setTimeout(()=>{closeUrlDialog();submitUrl.textContent='打开';submitUrl.disabled=false;setState('buffering');setTimeout(()=>setState('playing'),1300)},700)};
function toggleFull(){document.body.classList.toggle('fullscreen');fullBtn.setAttribute('aria-label',document.body.classList.contains('fullscreen')?'退出全屏':'进入全屏')}fullBtn.onclick=toggleFull;canvas.ondblclick=()=>{if(state!=='audio')toggleFull()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(urlLayer.classList.contains('open'))closeUrlDialog();else if(document.body.classList.contains('fullscreen'))toggleFull();speedMenu.classList.remove('open');modeMenu.classList.remove('open')}if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.key.toLowerCase()==='f'&&state!=='audio')toggleFull();if(e.key.toLowerCase()==='m')muteBtn.click();if(e.key.toLowerCase()==='n')nextBtn.click();if(e.key.toLowerCase()==='p')prevBtn.click();if(e.ctrlKey&&e.key.toLowerCase()==='u'){e.preventDefault();openUrlDialog()}if(e.ctrlKey&&e.key.toLowerCase()==='o'){e.preventDefault();simulateOpen()}});document.addEventListener('click',e=>{if(!e.target.closest('#speedBtn')&&!e.target.closest('#speedMenu'))speedMenu.classList.remove('open');if(!e.target.closest('#modeBtn')&&!e.target.closest('#modeMenu'))modeMenu.classList.remove('open')});renderList();setState('playing');
</script>
</body></html>
